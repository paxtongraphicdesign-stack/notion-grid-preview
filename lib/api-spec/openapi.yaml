openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Notion content calendar posts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      summary: Get all visible posts from Notion
      description: Returns all non-hidden posts from the Notion content calendar database
      responses:
        "200":
          description: Posts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MediaItem:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          enum: [image, video, canva, unknown]
        url:
          type: string
        name:
          type: ["string", "null"]
    NotionPost:
      type: object
      required: [id, notionUrl, title, date, caption, hidden, pinned, platforms, status, media]
      properties:
        id:
          type: string
        notionUrl:
          type: string
        title:
          type: string
        date:
          type: ["string", "null"]
        caption:
          type: string
        hidden:
          type: boolean
        pinned:
          type: boolean
        platforms:
          type: array
          items:
            type: string
        status:
          type: ["string", "null"]
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
    PostsResponse:
      type: object
      required: [posts, fetchedAt]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/NotionPost"
        fetchedAt:
          type: string
        error:
          type: ["string", "null"]
